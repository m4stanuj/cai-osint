<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cai-osint // Autonomous AI OSINT Terminal Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border: #1e293b;
      --cyan: #38bdf8;
      --green: #4ade80;
      --yellow: #facc15;
      --red: #f87171;
      --purple: #c084fc;
      --text: #f1f5f9;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, var(--bg) 60%);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--cyan);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      text-align: center;
      background: linear-gradient(135deg, #fff 30%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 2rem;
      text-align: center;
    }
    .terminal-window {
      width: 100%;
      max-width: 860px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .terminal-header {
      background: #161b22;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid #21262d;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }
    .terminal-title {
      color: var(--muted);
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      margin-left: auto;
      margin-right: auto;
    }
    .terminal-body {
      padding: 1.5rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      min-height: 380px;
      color: #e6edf3;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .c-cyan { color: var(--cyan); }
    .c-green { color: var(--green); }
    .c-yellow { color: var(--yellow); }
    .c-red { color: var(--red); }
    .c-muted { color: var(--muted); }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background: var(--cyan);
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    .controls {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    button {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }
  </style>
</head>
<body>

  <div class="badge">Autonomous MCP Security Framework</div>
  <h1>cai-osint Live Recon Demonstration</h1>
  <p class="subtitle">Real-time passive OSINT, SSL cipher audit, port probe, and executive vulnerability synthesis.</p>

  <div class="terminal-window">
    <div class="terminal-header">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="terminal-title">m4stanuj@cai-osint:~ (stdio-mcp)</div>
    </div>
    <div class="terminal-body" id="terminal"></div>
  </div>

  <div class="controls">
    <button onclick="restartDemo()">Replay 30s Demonstration</button>
  </div>

  <script>
    const term = document.getElementById('terminal');
    const logs = [
      { text: "$ openwork run cai-osint --target target.corp.local --audit\n\n", delay: 300 },
      { text: "\x1b[36m[cai-osint]\x1b[0m Initializing Autonomous Agent via Model Context Protocol...\n", delay: 600 },
      { text: "\x1b[33m[1/4] Passive Recon\x1b[0m: Resolving DNS hierarchy & CDN endpoints...\n", delay: 700 },
      { text: "      ✔ A Record: 192.88.99.1 (Cloudflare Edge Node)\n", delay: 400 },
      { text: "      ✔ MX Records: alt1.aspmx.l.google.com [Priority 5]\n", delay: 400 },
      { text: "      ✔ SPF/DMARC: v=DMARC1; p=reject (Strict policy active)\n\n", delay: 500 },
      { text: "\x1b[33m[2/4] TLS Inspection\x1b[0m: Querying SSL/TLS Certificate on :443...\n", delay: 800 },
      { text: "      ✔ Issuer: Google Trust Services LLC\n", delay: 400 },
      { text: "      ✔ Expiry: Valid until 2027-01-15 (128 days remaining)\n", delay: 400 },
      { text: "      ✔ Ciphers: TLS 1.3 / ChaCha20-Poly1305 (Compliant)\n\n", delay: 500 },
      { text: "\x1b[33m[3/4] Perimeter Probe\x1b[0m: Scanning standard service ports...\n", delay: 900 },
      { text: "      ✔ Port 80/tcp  [OPEN]  nginx/1.24 (Redirect to HTTPS)\n", delay: 400 },
      { text: "      ✔ Port 443/tcp [OPEN]  HTTPS Secure Gateway\n", delay: 400 },
      { text: "      ✔ Port 22/tcp  [FILTERED]  OpenSSH (Firewall drop rule)\n", delay: 400 },
      { text: "      ✔ Port 6379/tcp [CLOSED]  Redis cache not publicly reachable\n\n", delay: 500 },
      { text: "\x1b[33m[4/4] Synthesis\x1b[0m: Compiling Executive Audit & Posture Rating...\n", delay: 1000 },
      { text: "─────────────────────────────────────────────────────────────\n", delay: 300 },
      { text: "\x1b[32m✔ TARGET SECURITY POSTURE: SECURE (9.5 / 10.0)\x1b[0m\n", delay: 400 },
      { text: "✔ Critical Findings: 0 | High: 0 | Medium: 1 (HSTS Preload recommended)\n", delay: 400 },
      { text: "✔ Executive Report Generated: reports/audit_target_corp_local.md\n", delay: 500 },
      { text: "─────────────────────────────────────────────────────────────\n\nAgent audit complete. Return turn to MCP Client. <span class='cursor'></span>", delay: 300 }
    ];

    function formatText(str) {
      return str
        .replace(/\x1b\[36m/g, "<span class='c-cyan'>")
        .replace(/\x1b\[33m/g, "<span class='c-yellow'>")
        .replace(/\x1b\[32m/g, "<span class='c-green'>")
        .replace(/\x1b\[31m/g, "<span class='c-red'>")
        .replace(/\x1b\[0m/g, "</span>");
    }

    let currentTimeout = null;
    function playDemo() {
      term.innerHTML = "<span class='cursor'></span>";
      let accumulated = "";
      let i = 0;

      function nextStep() {
        if (i >= logs.length) return;
        const item = logs[i];
        accumulated += formatText(item.text);
        term.innerHTML = accumulated;
        i++;
        currentTimeout = setTimeout(nextStep, item.delay);
      }
      nextStep();
    }

    function restartDemo() {
      if (currentTimeout) clearTimeout(currentTimeout);
      playDemo();
    }

    playDemo();
  </script>
</body>
</html>
